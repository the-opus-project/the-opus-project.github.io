name: deploy catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      review_pr:
        description: 'PR number to publish as explicitly unmerged review drafts (blank for main)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LilyPond
        run: sudo apt-get update && sudo apt-get install --yes lilypond
      - name: Validate repository
        run: python3 scripts/check.py --write
      - name: Build catalog, sources, and PDFs
        env:
          OPUS_REVIEW_PR: ${{ inputs.review_pr }}
        run: |
          if [ -n "$OPUS_REVIEW_PR" ]; then
            python3 scripts/build_site.py _site --review-pr "$OPUS_REVIEW_PR" --review-revision "$GITHUB_SHA"
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo 'Non-main deployments must identify their review PR.' >&2
              exit 1
            fi
            python3 scripts/build_site.py _site
          fi
      - if: github.event.repository.private == false
        uses: actions/configure-pages@v5
      - if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
